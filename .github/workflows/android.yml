# Continuous build for the Android app.
#
# The Firebird AAR is not stored in git: scripts/fetch-firebird-android.ps1
# downloads the official embedded Android build, patches the flock() PLT
# stubs for Android FUSE storage and stages the libraries CMake links
# against. The same script is used for local setup.
name: android-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Provision Firebird embedded engine
        run: |
          zip_tool="$(command -v 7z || command -v 7zz || true)"
          if [ -z "$zip_tool" ]; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
            zip_tool="$(command -v 7z)"
          fi
          pwsh -NoProfile -File scripts/fetch-firebird-android.ps1 -SevenZip "$zip_tool"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vvvdroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
