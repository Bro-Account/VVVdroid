# Tag-driven release: pushing v<versionName> builds a signed release APK and
# publishes it as a GitHub release.
#
# Signing material (never in git) comes from repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the PKCS12 keystore
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias (vvvdroid)
#   ANDROID_KEY_PASSWORD       key password
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Provision Firebird embedded engine
        run: |
          zip_tool="$(command -v 7z || command -v 7zz || true)"
          if [ -z "$zip_tool" ]; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
            zip_tool="$(command -v 7z)"
          fi
          pwsh -NoProfile -File scripts/fetch-firebird-android.ps1 -SevenZip "$zip_tool"

      - name: Check the tag against versionName
        run: |
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag versionName=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${version} in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::signing secrets are incomplete"
            exit 1
          fi
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="VVVdroid-${version}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "VVVdroid-${version}.apk" "VVVdroid-${version}.apk.sha256" \
            --title "VVVdroid ${version}" \
            --generate-notes
